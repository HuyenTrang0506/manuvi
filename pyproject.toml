[project]
name = "manuvi"
version = "0.1.0"
description = "EN to VI translation of long technical manuals with terminology enforcement, automated QA and human review"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.24.0",
    "pydantic>=2.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "boto3>=1.34",
]

[project.scripts]
manuvi = "src.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "moto[ssm,s3,sts]>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"src.glossary" = ["seeds/*.csv"]
"src.intake" = ["patterns.yaml"]
"src.webapp" = ["static/*.html"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["legacy*"]
