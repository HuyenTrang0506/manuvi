# Run from /opt/manuvi/src/deploy via bootstrap.sh / the manuvi systemd unit.
# Only Caddy publishes ports. The app is reachable on the internal network only.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: manuvi-app:local
    restart: unless-stopped
    env_file: /opt/manuvi/.env
    environment:
      MANUVI_DATA_DIR: /var/lib/manuvi
      # Computed by start.sh (domain, or public IP/DNS from IMDS); the app rejects other Host headers.
      MANUVI_ALLOWED_HOSTS: ${MANUVI_ALLOWED_HOSTS:-}
      # X-Forwarded-* are believed only from the Caddy container (fixed address below), not from '*'.
      MANUVI_FORWARDED_ALLOW_IPS: 172.29.0.2
      # The compose network: the only peers whose CF-Connecting-IP may count (and only with MANUVI_TRUST_CF=1).
      MANUVI_TRUSTED_PROXIES: 172.29.0.0/24
      # 1 only when the Cloudflare Tunnel is on (MANUVI_TUNNEL=1): then CF-Connecting-IP is believed from that network.
      MANUVI_TRUST_CF: ${MANUVI_TUNNEL:-0}
    volumes:
      - app-data:/var/lib/manuvi
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    networks:
      default:
        ipv4_address: 172.29.0.2
    ports:
      - "80:80"
      - "443:443"
    environment:
      MANUVI_DOMAIN: ${MANUVI_DOMAIN:-}
    volumes:
      # Domain set -> Caddyfile (automatic HTTPS). Otherwise Caddyfile.internal (self-signed).
      - ./${CADDYFILE:-Caddyfile.internal}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

  # Option B: Cloudflare Tunnel (outbound only). Enable with MANUVI_TUNNEL=1 in /opt/manuvi/.env.
  # Point the tunnel public hostname at http://caddy:8080 (internal, not published).
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - caddy

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  app-data:
  caddy-data:
  caddy-config:
