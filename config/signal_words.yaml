# Fixed EN -> VI forms for signal words. A mismatch between source and target is an Error.
# The pipeline and `manuvi eval` split a LEADING signal word off BEFORE the model call and re-attach this fixed
# Vietnamese form afterwards (src/guard/segment.py), so the model never translates it.
status: proposed          # PROPOSED by engineering; NOT approved
approval: "pending founder/uncle approval (set status: approved and approved_by when they sign off)"
approved_by: ""
signal_words:
  DANGER: "NGUY HIỂM"
  WARNING: "CẢNH BÁO"
  CAUTION: "THẬN TRỌNG"
  NOTE: "LƯU Ý"
  IMPORTANT: "QUAN TRỌNG"
# YES/NO are deliberately not here: too ambiguous inside prose ("NO. 5 valve").
