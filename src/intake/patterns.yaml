# Regex patterns for protected codes. Matches are never translated and are kept
# exactly as printed (including wrap newlines / spaces / dots inside the match).
protected_patterns:
  # Harness/wire codes, e.g. YT12-AB3C, "YT 12-AB3C", "YT12-\nAB3C", YT12.AB3C
  - name: harness_code
    regex: '(?<![A-Za-z0-9])YT\s?[0-9]{2}[A-Z0-9]*(?:(?:-\s*|\.)[A-Z0-9]+(?![a-z]))*'
  - name: part_number
    regex: '(?<![A-Za-z0-9])[A-Z]{1,3}[0-9]{2,}-[0-9]{2,}[A-Z0-9\-]*'
  - name: long_numeric_part
    regex: '(?<![A-Za-z0-9])[0-9]{2,}[A-Z][0-9]{3,}[A-Z0-9\-]*'
  - name: pin_number
    regex: '(?<![A-Za-z0-9])(?i:pin|terminal)\s*(?:No\.?\s*)?[0-9]+(?![A-Za-z0-9])'
  - name: figure_page_ref
    regex: '(?<![A-Za-z0-9])(?:Fig\.?\s*[0-9]+(?:-[0-9]+)*|(?i:page)\s+[0-9]+(?:-[0-9]+)?)'
  - name: value_unit
    regex: '(?<![A-Za-z0-9])[0-9]+(?:[.,][0-9]+)?\s?(?:mm²|mm2|mm|kΩ|Ω|V|A|Hz|kPa|MPa|N·m|rpm|°C|%)(?![A-Za-z])'
