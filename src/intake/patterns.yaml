# Regex patterns for protected codes. Matches are never translated and are kept
# exactly as printed (including wrap newlines / spaces / dots inside the match).
protected_patterns:
  # Harness/wire codes, e.g. YT12-AB3C, "YT 12-AB3C", "YT12-\nAB3C", YT12.AB3C
  - name: harness_code
    regex: '\bYT\s?\d{2}[A-Z0-9]*(?:(?:-\s*|\.)[A-Z0-9]+(?![a-z]))*'
  - name: part_number
    regex: '\b[A-Z]{1,3}\d{2,}-\d{2,}[A-Z0-9\-]*'
  - name: long_numeric_part
    regex: '\b\d{2,}[A-Z]\d{3,}[A-Z0-9\-]*'
  - name: pin_number
    regex: '\b(?i:pin|terminal)\s*(?:No\.?\s*)?\d+\b'
  - name: figure_page_ref
    regex: '\b(?:Fig\.?\s*\d+(?:-\d+)*|(?i:page)\s+\d+(?:-\d+)?)'
  - name: value_unit
    regex: '\b\d+(?:[.,]\d+)?\s?(?:mm²|mm2|mm|kΩ|Ω|V|A|Hz|kPa|MPa|N·m|rpm|°C|%)(?![A-Za-z])'
